name: Create Release PR

on:
  push:
    branches:
      - "release/*"  # Se activará solo si la branch empieza con "release/"

jobs:
  create_release_pr:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout del repositorio
        uses: actions/checkout@v3

      - name: 📦 Instalar dependencias de GitHub CLI y jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          gh --version

      - name: 🔑 Autenticación con GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Autenticando en GitHub CLI..."
          gh auth status

      - name: 🚀 Ejecutar release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x release.sh
          ./release.sh $(echo $GITHUB_REF | awk -F'/' '{print $3}')
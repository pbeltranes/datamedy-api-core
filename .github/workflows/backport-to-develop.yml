name: Backport to Develop on Release Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract release branch name
        id: extract_branch
        run: |
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          BACKPORT_BRANCH="backport/${PR_BRANCH#release/}"
          echo "backport_branch=$BACKPORT_BRANCH" >> $GITHUB_ENV

      - name: Setup Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create backport branch
        run: |
          git checkout -b ${{ env.backport_branch }}
          git push origin ${{ env.backport_branch }}

      - name: Create PR to Develop
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          base: develop
          branch: ${{ env.backport_branch }}
          title: "Backport from Release - ${{ env.backport_branch }}"
          body: "Automated backport from release branch to develop."
          draft: false
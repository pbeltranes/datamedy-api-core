name: Backport to Develop on Release Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate branch name
        id: date
        run: echo "branch_name=backport/$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create backport branch
        run: |
          git checkout -b ${{ steps.date.outputs.branch_name }}
          git push origin ${{ steps.date.outputs.branch_name }}

      - name: Create PR to Develop
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          title: "Backport from Main - ${{ steps.date.outputs.branch_name }}"
          body: "Automated PR containing latest changes from Main branch"
          draft: false
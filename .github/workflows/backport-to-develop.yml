name: Backport Master to Develop

on:
  pull_request:
    types:
      - closed
    branches:
      - master  # Se activa cuando un PR hacia master es mergeado

jobs:
  backport_to_develop:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout del repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Se necesita todo el historial para los merge correctos

      - name: 🔑 Configurar Git y autenticación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh auth status

      - name: 🔄 Crear Branch de Backport
        run: |
          BACKPORT_BRANCH="backport-$(date +'%Y%m%d%H%M%S')"
          git checkout -b $BACKPORT_BRANCH
          git merge origin/master --no-edit
          git push origin $BACKPORT_BRANCH

      - name: 🚀 Crear Pull Request a Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create --base develop --head $BACKPORT_BRANCH --title "Backport cambios de master a develop" --body "Este PR sincroniza los cambios recientes de master a develop.")
          echo "Pull Request creado: $PR_URL"